[project]
name = "onset"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oguzb", email = "hoguzbolat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.11",
    "numpy>=2.0",
    "pandas>=2.2",
    "torch>=2.8",
]

[project.scripts]
onset = "onset:main"

[project.optional-dependencies]
build = [
    "obspy>=1.4",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
